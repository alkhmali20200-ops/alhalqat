<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول – نظام إدارة حلقات القرآن الكريم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
    * { font-family: 'Amiri', serif; }
    body {
      background-color: #0d2b1f;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(21,128,61,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 50%, rgba(161,138,61,0.1) 0%, transparent 50%);
      min-height: 100vh;
    }
    .geometric-border {
      border-image: linear-gradient(45deg, #b5922a, #e8c96a, #b5922a) 1;
    }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    input:focus { outline: none; box-shadow: 0 0 0 3px rgba(21,128,61,0.3); }
  </style>
  <script src="js/config.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md fade-in">

    <!-- بطاقة الدخول -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- رأس الصفحة -->
      <div class="bg-gradient-to-br from-green-900 via-green-800 to-green-900 p-8 text-center relative overflow-hidden">
        <!-- زخرفة هندسية إسلامية -->
        <div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\'40\' height=\'40\' viewBox=\'0 0 40 40\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M20 0l5 10h10l-8 6 3 10-10-7-10 7 3-10-8-6h10z\' fill=\'%23fbbf24\' fill-opacity=\'1\'/%3E%3C/svg%3E');"></div>
        <div class="relative z-10">
          <!-- أيقونة المصحف -->
          <div class="w-20 h-20 mx-auto mb-4 bg-gradient-to-br from-yellow-500 to-yellow-700 rounded-full flex items-center justify-center shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-white mb-1">نظام إدارة الحلقات</h1>
          <p class="text-yellow-300 text-sm">جمعية تحفيظ القرآن الكريم</p>
          <p class="text-green-300 text-xs mt-1">﴿ وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ ﴾</p>
        </div>
      </div>

      <!-- نموذج تسجيل الدخول -->
      <div class="p-8">
        <h2 class="text-xl font-bold text-gray-800 mb-6 text-center">تسجيل الدخول</h2>

        <!-- رسالة الخطأ -->
        <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 mb-5 text-center text-sm"></div>
        <!-- رسالة النجاح -->
        <div id="successMsg" class="hidden bg-green-50 border border-green-200 text-green-700 rounded-lg p-3 mb-5 text-center text-sm"></div>

        <form id="loginForm" class="space-y-5" novalidate>
          <div>
            <label for="email" class="block text-sm font-bold text-gray-700 mb-2">البريد الإلكتروني</label>
            <input type="email" id="email" name="email" required autocomplete="email"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-gray-800 transition-all duration-200 hover:border-green-300"
              placeholder="example@gmail.com">
          </div>

          <div>
            <label for="password" class="block text-sm font-bold text-gray-700 mb-2">كلمة المرور</label>
            <div class="relative">
              <input type="password" id="password" name="password" required autocomplete="current-password"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-gray-800 transition-all duration-200 hover:border-green-300"
                placeholder="••••••••">
              <button type="button" id="togglePassword"
                class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                title="إظهار/إخفاء كلمة المرور">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" id="loginBtn"
            class="w-full bg-gradient-to-r from-green-700 to-green-800 hover:from-green-800 hover:to-green-900 text-white font-bold py-3.5 px-6 rounded-xl transition-all duration-200 shadow-md hover:shadow-lg flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
            </svg>
            دخول إلى النظام
          </button>
        </form>

        <!-- نسيت كلمة المرور -->
        <div class="mt-5 text-center">
          <button id="forgotPasswordBtn" class="text-green-700 hover:text-green-900 text-sm font-medium underline decoration-dotted">
            نسيت كلمة المرور؟
          </button>
        </div>

        <!-- نموذج استعادة كلمة المرور (مخفي) -->
        <div id="resetForm" class="hidden mt-5 p-4 bg-gray-50 rounded-xl border border-gray-200">
          <p class="text-sm text-gray-600 mb-3 font-bold">استعادة كلمة المرور</p>
          <p class="text-xs text-gray-500 mb-3">أدخل بريدك الإلكتروني وسيُرسَل لك رابط إعادة الضبط.</p>
          <div class="flex gap-2">
            <input type="email" id="resetEmail"
              class="flex-1 px-3 py-2 border-2 border-gray-200 rounded-lg text-sm"
              placeholder="بريدك الإلكتروني">
            <button id="sendResetBtn"
              class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded-lg text-sm font-bold">
              إرسال
            </button>
          </div>
        </div>
      </div>

      <!-- تذييل -->
      <div class="bg-gray-50 border-t px-6 py-3 text-center text-xs text-gray-400">
        نظام محمي بتسجيل الدخول · جميع البيانات مشفرة
      </div>
    </div>

    <!-- رسالة للمسؤول -->
    <div class="mt-4 text-center text-green-400 text-xs opacity-70">
      إذا لم يكن لديك حساب، يرجى التواصل مع مسؤول النظام
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseApp = initializeApp(window.__firebase_config_obj);
    const auth = getAuth(firebaseApp);

    // إذا كان المستخدم مسجل دخوله بالفعل، انتقل مباشرة للتطبيق
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace('app.html');
      }
    });

    const loginForm   = document.getElementById('loginForm');
    const errorMsg    = document.getElementById('errorMsg');
    const successMsg  = document.getElementById('successMsg');
    const loginBtn    = document.getElementById('loginBtn');

    const arabicErrors = {
      'auth/invalid-email'        : 'البريد الإلكتروني غير صحيح',
      'auth/user-disabled'        : 'تم تعطيل هذا الحساب، يرجى التواصل مع المسؤول',
      'auth/user-not-found'       : 'لا يوجد حساب بهذا البريد الإلكتروني',
      'auth/wrong-password'       : 'كلمة المرور غير صحيحة',
      'auth/invalid-credential'   : 'البريد الإلكتروني أو كلمة المرور غير صحيحة',
      'auth/too-many-requests'    : 'تم تجاوز عدد المحاولات، يرجى المحاولة لاحقاً',
      'auth/network-request-failed': 'فشل الاتصال بالإنترنت',
    };

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove('hidden');
      successMsg.classList.add('hidden');
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.classList.remove('hidden');
      errorMsg.classList.add('hidden');
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtn.innerHTML = loading
        ? `<svg class="spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
             <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
             <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
           </svg> جاري الدخول...`
        : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
           </svg> دخول إلى النظام`;
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showError('يرجى إدخال البريد وكلمة المرور'); return; }
      setLoading(true);
      try {
        await signInWithEmailAndPassword(auth, email, password);
        // سيتم التوجيه تلقائياً عبر onAuthStateChanged
      } catch (err) {
        showError(arabicErrors[err.code] || `خطأ في تسجيل الدخول: ${err.message}`);
        setLoading(false);
      }
    });

    // إظهار/إخفاء كلمة المرور
    document.getElementById('togglePassword').addEventListener('click', () => {
      const passInput = document.getElementById('password');
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    });

    // استعادة كلمة المرور
    document.getElementById('forgotPasswordBtn').addEventListener('click', () => {
      document.getElementById('resetForm').classList.toggle('hidden');
    });

    document.getElementById('sendResetBtn').addEventListener('click', async () => {
      const email = document.getElementById('resetEmail').value.trim();
      if (!email) { showError('يرجى إدخال البريد الإلكتروني'); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        showSuccess('تم إرسال رابط الاستعادة. تحقق من بريدك الإلكتروني (وخانة البريد غير المرغوب فيه).');
        document.getElementById('resetForm').classList.add('hidden');
      } catch (err) {
        showError(arabicErrors[err.code] || 'فشل الإرسال. تأكد من صحة البريد الإلكتروني.');
      }
    });

    // ضغط Enter في حقل كلمة المرور
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
    });
  </script>
</body>
</html>
